name: CI Node

on:
  push:
    branches: [main, develop]

jobs:
  pratica:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependências
        run: "npm install"

      - name: Build
        run: "npm run build"

      - name: Executar testes
        run: "npm test"

  dast-zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Criar Imagem Docker
        run: docker build -t node-server:1.0 ./

      - name: Iniciar Container para DAST Scan
        run: docker run -p 127.0.0.1:3000:3000 -d node-server:1.0

      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3000"
          cmd_options: '-z "-config view.locale=pt_BR"'
